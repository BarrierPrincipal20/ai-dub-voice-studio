[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-dub-voice-studio"
version = "0.6.2"
description = "Windows desktop AI dubbing and translation voice generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-dub-voice-studio contributors" }]
keywords = ["dubbing", "translation", "tts", "asr", "voice-cloning", "windows"]
dependencies = [
    "PySide6>=6.7,<7",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "onnxruntime-gpu>=1.18; platform_system=='Windows'",
    "onnxruntime>=1.18; platform_system!='Windows'",
    "torch>=2.3",
    "transformers>=4.42",
    "sentencepiece>=0.2",
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
]
cuda = ["torch>=2.3+cu121"]

[project.scripts]
ai-dub = "ai_dub.cli:app"
ai-dub-studio = "ai_dub.app:main"

[project.urls]
Homepage = "https://github.com/ai-dub-voice-studio/ai-dub-voice-studio"
Issues = "https://github.com/ai-dub-voice-studio/ai-dub-voice-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["ai_dub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ai_dub/services", "ai_dub/models", "ai_dub/handlers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]